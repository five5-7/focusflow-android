name: Build FocusFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Read versionName
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk "FocusFlow-$VERSION_NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-$VERSION_NAME-apk
          path: FocusFlow-$VERSION_NAME.apk
          if-no-files-found: error
          retention-days: 7
