name: Publish FocusFlow 8.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-8.0.0.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-v8.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'five5-7/focusflow-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved source and successful build
        uses: actions/github-script@v7
        with:
          script: |
            const source = '3a3f535cfb020b4e86c4582f100cc6789cf52944';
            const runId = 34180121086;
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (run.head_sha !== source || run.run_number !== 308 || run.conclusion !== 'success' ||
                run.head_repository.full_name !== context.payload.repository.full_name ||
                run.path !== '.github/workflows/build-apk.yml') throw new Error('Unapproved source build');
            // Only release notes and this workflow may differ from the verified application source.
            await exec.exec('git', ['diff', '--exit-code', source, context.sha, '--',
              'app', 'gradle', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: runId});
            const matches = artifacts.filter(a => a.name === 'FocusFlow-8.0.0-run-308-apk');
            if (matches.length !== 1 || matches[0].id !== 10038682688 || matches[0].expired ||
                matches[0].digest !== 'sha256:8632ba8b03842ac6317134477ff7012238f80e4bfa1360114732cfb1ba95429a') {
              throw new Error('Approved artifact missing, expired or changed');
            }

      - name: Download approved APK without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: FocusFlow-8.0.0-run-308-apk
          run-id: 34180121086
          github-token: ${{ github.token }}
          path: release-artifact

      - name: Recheck checksum, signing certificate and application metadata
        shell: bash
        run: |
          set -euo pipefail
          apk='release-artifact/FocusFlow-8.0.0-run-308.apk'
          printf '%s  %s\n' 'f3c3a654666de500a2d60eb59b93e26c401b00ffe081bca2c1aabf5418f72514' "$apk" | sha256sum --check
          test "$(stat -c '%s' "$apk")" = 7540290
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "$apk" > signature.txt
          grep -Fq 'certificate SHA-256 digest: 650a17f2bbc6d3cf7ac436e3ce7d4cbc1381cfd29052d6a8e06e70361ef48e8e' signature.txt
          "$build_tools/aapt" dump badging "$apk" > metadata.txt
          grep -Fq "package: name='com.sakata.focusflow' versionCode='513' versionName='8.0.0'" metadata.txt
          if grep -q '^application-debuggable' metadata.txt; then exit 1; fi

      - name: Upload verified asset then publish as Latest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const tag = 'v8.0.0';
            const name = 'FocusFlow-8.0.0-run-308.apk';
            const expected = 'sha256:f3c3a654666de500a2d60eb59b93e26c401b00ffe081bca2c1aabf5418f72514';
            const bytes = fs.readFileSync('release-artifact/' + name);
            if ('sha256:' + crypto.createHash('sha256').update(bytes).digest('hex') !== expected) {
              throw new Error('Checksum changed before upload');
            }
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data; }
            catch (e) { if (e.status !== 404) throw e; }
            if (release && release.target_commitish !== context.sha) {
              throw new Error('Existing release belongs to another commit; refusing to overwrite');
            }
            try {
              const {data: ref} = await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag});
              if (ref.object.sha !== context.sha) throw new Error('Existing tag points elsewhere');
            } catch (e) { if (e.status !== 404) throw e; }
            const body = fs.readFileSync('docs/8.0.0-release-notes.md', 'utf8');
            if (!release) release = (await github.rest.repos.createRelease({...context.repo,
              tag_name: tag, target_commitish: context.sha, name: 'FocusFlow 8.0.0 · 第三个正式版',
              body, draft: true, prerelease: false})).data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets,
              {...context.repo, release_id: release.id});
            let asset = assets.find(a => a.name === name);
            if (!asset) asset = (await github.rest.repos.uploadReleaseAsset({...context.repo,
              release_id: release.id, name, data: bytes,
              headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': bytes.length}
            })).data;
            if (asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest !== expected) {
              throw new Error('Remote asset verification failed; release stays draft, no deletion');
            }
            if (release.draft) release = (await github.rest.repos.updateRelease({...context.repo,
              release_id: release.id, draft: false, prerelease: false, make_latest: 'true'})).data;
            if (release.prerelease || !release.published_at) throw new Error('Release is not public/stable');
            await core.summary.addHeading('FocusFlow 8.0.0 published')
              .addLink('Release', release.html_url).addBreak()
              .addLink(name, asset.browser_download_url).addBreak()
              .addRaw(expected).write();
