name: Repair 8.2.0 tests
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > app/src/test/java/com/sakata/focusflow/RichEffectsTest.kt
          printf '%s' '' | base64 -d | gzip -d > app/src/test/java/com/sakata/focusflow/AppearanceSpecTest.kt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/test/java/com/sakata/focusflow/RichEffectsTest.kt app/src/test/java/com/sakata/focusflow/AppearanceSpecTest.kt
          git commit -m "test: restore complete 8.2.0 appearance tests"
          git push origin HEAD:main
