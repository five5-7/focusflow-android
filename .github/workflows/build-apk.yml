name: Build FocusFlow APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$version_name" = "8.2.0-rc.2"
          test "$version_code" = "524"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare stable signing key
        env:
          FOCUSFLOW_KEYSTORE_BASE64: ${{ secrets.FOCUSFLOW_KEYSTORE_BASE64 }}
          FOCUSFLOW_SIGNING_STORE_PASSWORD: ${{ secrets.FOCUSFLOW_SIGNING_STORE_PASSWORD }}
          FOCUSFLOW_SIGNING_KEY_ALIAS: ${{ secrets.FOCUSFLOW_SIGNING_KEY_ALIAS }}
          FOCUSFLOW_SIGNING_KEY_PASSWORD: ${{ secrets.FOCUSFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FOCUSFLOW_KEYSTORE_BASE64"
          test -n "$FOCUSFLOW_SIGNING_STORE_PASSWORD"
          test -n "$FOCUSFLOW_SIGNING_KEY_PASSWORD"
          store="$RUNNER_TEMP/focusflow-release.jks"
          printf '%s' "$FOCUSFLOW_KEYSTORE_BASE64" | base64 --decode > "$store"
          keytool -list -v -keystore "$store" -storepass "$FOCUSFLOW_SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/keystore-info.txt"
          store_type="$(sed -n 's/^Keystore type: //p' "$RUNNER_TEMP/keystore-info.txt" | head -1)"
          mapfile -t private_aliases < <(awk -F': ' '/^Alias name: / { alias=$2 } /^Entry type: PrivateKeyEntry/ { print alias }' "$RUNNER_TEMP/keystore-info.txt")
          configured_alias="$FOCUSFLOW_SIGNING_KEY_ALIAS"
          if printf '%s\n' "${private_aliases[@]}" | grep -Fxq "$configured_alias"; then
            resolved_alias="$configured_alias"
          elif [ "${#private_aliases[@]}" -eq 1 ]; then
            resolved_alias="${private_aliases[0]}"
          else
            echo "::error::Unable to resolve signing alias"; exit 1
          fi
          cat > "$RUNNER_TEMP/CheckPrivateKey.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.security.KeyStore;
          public final class CheckPrivateKey {
            public static void main(String[] args) throws Exception {
              KeyStore store = KeyStore.getInstance(args[4]);
              try (FileInputStream input = new FileInputStream(args[0])) { store.load(input, args[1].toCharArray()); }
              if (store.getKey(args[2], args[3].toCharArray()) == null) System.exit(1);
            }
          }
          JAVA
          javac -d "$RUNNER_TEMP" "$RUNNER_TEMP/CheckPrivateKey.java"
          resolved_key_password="$FOCUSFLOW_SIGNING_KEY_PASSWORD"
          if ! java -cp "$RUNNER_TEMP" CheckPrivateKey "$store" "$FOCUSFLOW_SIGNING_STORE_PASSWORD" "$resolved_alias" "$resolved_key_password" "$store_type"; then
            resolved_key_password="$FOCUSFLOW_SIGNING_STORE_PASSWORD"
            java -cp "$RUNNER_TEMP" CheckPrivateKey "$store" "$FOCUSFLOW_SIGNING_STORE_PASSWORD" "$resolved_alias" "$resolved_key_password" "$store_type"
          fi
          echo "FOCUSFLOW_SIGNING_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "FOCUSFLOW_SIGNING_STORE_PASSWORD=$FOCUSFLOW_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FOCUSFLOW_SIGNING_KEY_ALIAS=$resolved_alias" >> "$GITHUB_ENV"
          echo "FOCUSFLOW_SIGNING_KEY_PASSWORD=$resolved_key_password" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release APK
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > apk-verification.txt
          "$build_tools/aapt" dump badging app/build/outputs/apk/release/app-release.apk >> apk-verification.txt
          sha256sum app/build/outputs/apk/release/app-release.apk >> apk-verification.txt

      - name: Package APK
        run: cp app/build/outputs/apk/release/app-release.apk FocusFlow-8.2.0-rc.2-run-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-8.2.0-rc.2-run-${{ github.run_number }}-apk
          path: FocusFlow-8.2.0-rc.2-run-${{ github.run_number }}.apk
          retention-days: 7

      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-8.2.0-rc.2-run-${{ github.run_number }}-verification
          path: apk-verification.txt
          if-no-files-found: warn
          retention-days: 7
