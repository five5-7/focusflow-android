name: Build FocusFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 签名只从仓库 Secret 读取，绝不写进代码或构建产物日志。
      # 单个 FOCUSFLOW_SIGNING_SECRETS 的格式见 README；缺失时直接失败，
      # 防止 CI 悄悄回退到 debug 签名而导致安装覆盖冲突。
      - name: Prepare stable signing key
        env:
          FOCUSFLOW_SIGNING_SECRETS: ${{ secrets.FOCUSFLOW_SIGNING_SECRETS }}
        run: |
          set -euo pipefail
          test -n "$FOCUSFLOW_SIGNING_SECRETS" || { echo "::error::Missing FOCUSFLOW_SIGNING_SECRETS"; exit 1; }
          umask 077
          signing_file="$RUNNER_TEMP/focusflow-signing.env"
          printf '%s' "$FOCUSFLOW_SIGNING_SECRETS" > "$signing_file"
          required=(FOCUSFLOW_SIGNING_STORE_BASE64 FOCUSFLOW_SIGNING_STORE_PASSWORD FOCUSFLOW_SIGNING_KEY_ALIAS FOCUSFLOW_SIGNING_KEY_PASSWORD)
          for key in "${required[@]}"; do
            grep -q "^${key}=" "$signing_file" || { echo "::error::Signing bundle is missing $key"; exit 1; }
          done
          # 该 secret 由仓库所有者维护；只读取四个白名单字段，不执行其中任何内容。
          value() { sed -n "s/^$1=//p" "$signing_file" | head -n 1; }
          store="$RUNNER_TEMP/focusflow-release.jks"
          printf '%s' "$(value FOCUSFLOW_SIGNING_STORE_BASE64)" | base64 --decode > "$store"
          test -s "$store" || { echo "::error::Signing keystore is empty"; exit 1; }
          echo "FOCUSFLOW_SIGNING_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "FOCUSFLOW_SIGNING_STORE_PASSWORD=$(value FOCUSFLOW_SIGNING_STORE_PASSWORD)" >> "$GITHUB_ENV"
          echo "FOCUSFLOW_SIGNING_KEY_ALIAS=$(value FOCUSFLOW_SIGNING_KEY_ALIAS)" >> "$GITHUB_ENV"
          echo "FOCUSFLOW_SIGNING_KEY_PASSWORD=$(value FOCUSFLOW_SIGNING_KEY_PASSWORD)" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Read version name
        run: echo "VERSION_NAME=$(sed -n 's/.*versionName = \"\(.*\)\"/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_ENV"

      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk "FocusFlow-$VERSION_NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-${{ env.VERSION_NAME }}-apk
          path: FocusFlow-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 7
