name: Build FocusFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main, v2/activity-mode]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare stable prototype signing key
        env:
          FOCUSFLOW_KEYSTORE_BASE64: ${{ secrets.FOCUSFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FOCUSFLOW_KEYSTORE_BASE64" ]; then
            printf '%s' "$FOCUSFLOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focusflow-debug.jks"
            echo "FOCUSFLOW_HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "FOCUSFLOW_HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
            echo "Signing secrets are not configured; this run validates compilation but will not upload an installable APK."
          fi

      - name: Build signed APK
        env:
          FOCUSFLOW_SIGNING_STORE_PASSWORD: ${{ secrets.FOCUSFLOW_SIGNING_STORE_PASSWORD }}
          FOCUSFLOW_SIGNING_KEY_ALIAS: ${{ secrets.FOCUSFLOW_SIGNING_KEY_ALIAS }}
          FOCUSFLOW_SIGNING_KEY_PASSWORD: ${{ secrets.FOCUSFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$FOCUSFLOW_HAS_SIGNING_KEY" = "true" ]; then
            export FOCUSFLOW_SIGNING_STORE_FILE="$RUNNER_TEMP/focusflow-debug.jks"
          fi
          gradle --no-daemon :app:assembleDebug

      - name: Name APK with version
        if: env.FOCUSFLOW_HAS_SIGNING_KEY == 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk FocusFlow-v2-preview.apk

      - name: Upload APK
        if: env.FOCUSFLOW_HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-v2-preview-apk
          path: FocusFlow-v2-preview.apk
          if-no-files-found: error
          retention-days: 7
