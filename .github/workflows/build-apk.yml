name: Build FocusFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare stable prototype signing key
        env:
          FOCUSFLOW_KEYSTORE_BASE64: ${{ secrets.FOCUSFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$FOCUSFLOW_KEYSTORE_BASE64" || (echo "Missing FOCUSFLOW_KEYSTORE_BASE64 repository secret" && exit 1)
          printf '%s' "$FOCUSFLOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focusflow-debug.jks"

      - name: Build signed APK
        env:
          FOCUSFLOW_SIGNING_STORE_FILE: ${{ runner.temp }}/focusflow-debug.jks
          FOCUSFLOW_SIGNING_STORE_PASSWORD: ${{ secrets.FOCUSFLOW_SIGNING_STORE_PASSWORD }}
          FOCUSFLOW_SIGNING_KEY_ALIAS: ${{ secrets.FOCUSFLOW_SIGNING_KEY_ALIAS }}
          FOCUSFLOW_SIGNING_KEY_PASSWORD: ${{ secrets.FOCUSFLOW_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk FocusFlow-1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-1.3-apk
          path: FocusFlow-1.3.apk
          if-no-files-found: error
          retention-days: 7
